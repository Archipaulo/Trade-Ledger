<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeLedger">
<meta name="description" content="TradeLedger — journal de trading complet : suivi des trades et positions, statistiques, calendrier P&L, et coach mental pour rester discipliné.">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TradeLedger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#26d07c; --green-dim:#1a7d4f; --red:#ff5d5d; --red-dim:#9e3838; --accent:#f5b544;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --display:'Bricolage Grotesque',var(--sans);
  }
  [data-theme="dark"]{
    --bg:#0a0e14; --panel:#121822; --panel-2:#0f141d; --line:#1e2733; --line-soft:#161d27;
    --txt:#e6edf3; --muted:#7d8a9c; --hover:#10161f; --input:#0c1118;
  }
  [data-theme="light"]{
    --bg:#f4f6f9; --panel:#ffffff; --panel-2:#f8fafc; --line:#e2e8f0; --line-soft:#eef2f6;
    --txt:#16202c; --muted:#64748b; --hover:#f1f5f9; --input:#f1f5f9;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(245,181,68,.06), transparent 60%),
      radial-gradient(800px 600px at -10% 110%, rgba(38,208,124,.05), transparent 55%),
      var(--bg);
    color:var(--txt);font-family:var(--sans);min-height:100vh;padding-bottom:90px;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--green-dim));display:grid;place-items:center;font-family:var(--mono);font-weight:600;color:#04130b;font-size:18px}
  .brand h1{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.4px}
  .topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  select,input,textarea{font-family:var(--mono);background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 10px;font-size:13.5px;outline:none;transition:.15s}
  textarea{font-family:var(--sans);resize:vertical}
  select:focus,input:focus,textarea:focus{border-color:var(--green);background:var(--panel-2)}
  .acct-sel{min-width:120px}
  button{font-family:var(--sans);cursor:pointer;border:none;border-radius:8px;font-weight:600;font-size:13px;transition:.15s}
  .ic{background:var(--panel);color:var(--txt);border:1px solid var(--line);width:38px;height:38px;display:grid;place-items:center;font-size:15px}
  .ic:hover{border-color:#33414f;background:var(--hover)}
  .btn-ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:9px 13px}
  .btn-ghost:hover{border-color:#33414f;background:var(--hover)}
  .btn-primary{background:linear-gradient(135deg,var(--green),var(--green-dim));color:#04130b;padding:9px 15px}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-danger{background:rgba(255,93,93,.12);color:var(--red);border:1px solid rgba(255,93,93,.3);padding:9px 13px}
  .btn-sm{padding:6px 10px;font-size:12px}
  /* nav */
  nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px;overflow-x:auto;margin-bottom:18px;position:sticky;top:8px;z-index:30}
  nav.tabs button{flex:1;white-space:nowrap;padding:10px 12px;background:none;color:var(--muted);border-radius:8px}
  nav.tabs button.active{background:linear-gradient(180deg,var(--green),var(--green-dim));color:#04130b}
  /* cards & stats */
  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:16px}
  .card h2{font-family:var(--display);font-weight:600;font-size:14.5px;margin-bottom:13px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px;margin-bottom:16px}
  .stat{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:13px;padding:14px 15px}
  .stat .label{font-size:10.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:600}
  .stat .val{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.5px}
  .stat .sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
  .pos{color:var(--green)} .neg{color:var(--red)}
  canvas{width:100%;display:block}
  /* filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters input,.filters select{flex:1;min-width:120px}
  /* table */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;padding:0 11px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--txt)}
  td{padding:11px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12.5px;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--hover)}
  .tag{display:inline-block;background:var(--input);border:1px solid var(--line);color:var(--accent);padding:1px 7px;border-radius:20px;font-size:10.5px;font-family:var(--sans);font-weight:600;margin:1px}
  .dir{font-weight:600;font-size:10.5px;padding:2px 7px;border-radius:5px}
  .dir.long{background:rgba(38,208,124,.12);color:var(--green)} .dir.short{background:rgba(255,93,93,.12);color:var(--red)}
  .rowbtn{background:none;color:var(--muted);font-size:14px;padding:3px 6px;border-radius:5px}
  .rowbtn:hover{background:var(--hover);color:var(--txt)}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty .big{font-family:var(--display);font-size:16px;color:var(--txt);margin-bottom:5px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(4,7,11,.72);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:80;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .modal h3{font-family:var(--display);font-weight:800;font-size:18px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--input);color:var(--muted)}
  .seg button.active.long{background:rgba(38,208,124,.14);border-color:var(--green);color:var(--green)}
  .seg button.active.short{background:rgba(255,93,93,.14);border-color:var(--red);color:var(--red)}
  .emoji-row{display:flex;gap:6px}
  .emoji-row button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--input);color:var(--muted);font-size:16px}
  .emoji-row button.active{border-color:var(--accent);background:rgba(245,181,68,.14)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--input);color:var(--muted);font-size:12px;font-family:var(--sans);font-weight:600;cursor:pointer}
  .chip.active{border-color:var(--accent);color:var(--accent);background:rgba(245,181,68,.12)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
  .pnl-preview{font-family:var(--mono);font-size:13px;color:var(--muted);margin:4px 0 12px;display:flex;gap:16px;flex-wrap:wrap}
  .shot-prev{max-width:100%;max-height:150px;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:none}
  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{text-align:center;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;padding-bottom:4px}
  .cal-cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);min-height:46px}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell .d{font-size:10.5px;color:var(--muted)}
  .cal-cell .v{font-size:11px;font-weight:600}
  .cal-cell.win{background:rgba(38,208,124,.13);border-color:rgba(38,208,124,.35)}
  .cal-cell.loss{background:rgba(255,93,93,.12);border-color:rgba(255,93,93,.32)}
  /* insights */
  .insight{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;line-height:1.45}
  .insight:last-child{border-bottom:none}
  .insight .dot{flex-shrink:0;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--accent)}
  .insight.good .dot{background:var(--green)} .insight.warn .dot{background:var(--red)}
  /* segmented bars */
  .segrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px}
  .segrow .name{width:120px;flex-shrink:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .segrow .bar{flex:1;height:18px;background:var(--input);border-radius:5px;overflow:hidden;position:relative}
  .segrow .fill{height:100%;border-radius:5px}
  .segrow .num{width:90px;text-align:right;font-family:var(--mono);flex-shrink:0}
  .muted{color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);font-style:italic;padding:6px 0}
  /* cashflow list */
  .cf{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
  .cf:last-child{border-bottom:none}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  /* toast */
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 40px rgba(0,0,0,.4);z-index:120;transition:transform .25s;font-size:13.5px}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast button{background:none;color:var(--green);font-weight:700}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:24px;font-family:var(--mono)}
  .switch{display:flex;align-items:center;gap:8px}
  .det-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
  .det-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px;margin-bottom:14px}
  .det-grid .k,.det-block .k{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  .det-grid .v{font-family:var(--mono);font-weight:600;margin-top:2px;font-size:14px}
  .det-block{margin-bottom:11px}
  .det-block .t{font-size:13.5px;line-height:1.45;white-space:pre-wrap;margin-top:3px}
  .det-shot{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:4px 0 12px;display:block}
  .goal-bar{height:12px;background:var(--input);border-radius:6px;overflow:hidden;margin-top:9px}
  .goal-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--green-dim));transition:width .3s}
  .banner{background:linear-gradient(180deg,rgba(245,181,68,.13),rgba(245,181,68,.04));border:1px solid rgba(245,181,68,.35);border-radius:13px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;font-size:13px}
  .row-click{cursor:pointer}
  .fab{position:fixed;right:18px;bottom:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green-dim));color:#04130b;font-size:30px;font-weight:600;box-shadow:0 10px 30px rgba(38,208,124,.4);z-index:60;display:grid;place-items:center;line-height:1;border:none;cursor:pointer}
  .fab:hover{filter:brightness(1.07);transform:translateY(-2px)}
  .recap{background:linear-gradient(150deg,#101826,#0a0e14);border:1px solid #1e2733;border-radius:18px;padding:22px;color:#e6edf3}
  .recap .rhead{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .recap .rlogo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--green),var(--green-dim));display:grid;place-items:center;color:#04130b;font-weight:600;font-family:var(--mono)}
  .recap .rk{font-size:11px;color:#7d8a9c;text-transform:uppercase;letter-spacing:.4px}
  .recap .rbig{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-1px;margin:5px 0}
  .recap .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:14px}
  .recap .rv{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:2px}
  .recap .rfoot{margin-top:16px;font-size:11px;color:#7d8a9c;text-align:center;letter-spacing:.3px}
  .choose-opt{display:block;width:100%;text-align:left;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:10px;color:var(--txt)}
  .choose-opt:hover{border-color:var(--green);background:var(--panel-2)}
  .choose-opt .co-t{font-weight:600;font-size:15px;font-family:var(--display)}
  .choose-opt .co-s{font-size:12.5px;color:var(--muted);margin-top:3px}
  .quiz-opts{display:flex;flex-direction:column;gap:6px}
  .quiz-opt{text-align:left;background:var(--input);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13.5px;width:100%}
  .quiz-opt.active{border-color:var(--green);background:rgba(38,208,124,.12);color:var(--green);font-weight:600}
  .tab-intro{color:var(--muted);font-size:13px;margin:-2px 0 16px;line-height:1.5}
  @media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.modal{padding:18px}.brand h1{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><div class="logo">↗</div><h1>TradeLedger</h1></div>
    <div class="topbar-right">
      <select class="acct-sel" id="acctSel" title="Compte"></select>
      <button class="ic" id="helpBtn" title="Aide" aria-label="Aide">?</button>
      <button class="ic" id="langBtn" title="Langue" aria-label="Changer de langue">FR</button>
      <button class="ic" id="themeBtn" title="Thème" aria-label="Changer de thème">☾</button>
      <button class="btn-primary" id="addBtn" data-i18n="newTrade">+ Trade</button>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active" data-i18n="tabDash">Tableau de bord</button>
    <button data-tab="trades" data-i18n="tabTrades">Trades</button>
    <button data-tab="calendar" data-i18n="tabCal">Calendrier</button>
    <button data-tab="analyse" data-i18n="tabAnalyse">Analyse</button>
    <button data-tab="mental" data-i18n="tabMental">Mental</button>
    <button data-tab="coach" data-i18n="tabCoach">Coach</button>
    <button data-tab="account" data-i18n="tabAccount">Compte</button>
  </nav>

  <section id="tab-dashboard" class="tab"></section>
  <section id="tab-trades" class="tab" style="display:none"></section>
  <section id="tab-calendar" class="tab" style="display:none"></section>
  <section id="tab-analyse" class="tab" style="display:none"></section>
  <section id="tab-mental" class="tab" style="display:none"></section>
  <section id="tab-coach" class="tab" style="display:none"></section>
  <section id="tab-account" class="tab" style="display:none"></section>

  <footer><span data-i18n="footer">Tes données restent sur ton appareil · TradeLedger</span></footer>
</div>

<!-- Trade modal -->
<div class="overlay" id="tradeOverlay">
  <div class="modal">
    <h3 id="tradeModalTitle" data-i18n="newTrade">Nouveau trade</h3>
    <div class="field">
      <label data-i18n="direction">Sens</label>
      <div class="seg" id="dirSeg">
        <button type="button" data-dir="long" class="active long" data-i18n="long">Long (achat)</button>
        <button type="button" data-dir="short" class="short" data-i18n="short">Short (vente)</button>
      </div>
    </div>
    <div class="grid3">
      <div class="field"><label data-i18n="symbol">Actif</label><input id="f_symbol" placeholder="BTC, AAPL…"></div>
      <div class="field"><label data-i18n="dateOpen">Date entrée</label><input id="f_dateOpen" type="date"></div>
      <div class="field"><label data-i18n="timeOpen">Heure (opt.)</label><input id="f_timeOpen" type="time"></div>
    </div>
    <div class="grid3">
      <div class="field"><label data-i18n="entry">Prix entrée</label><input id="f_entry" type="number" step="any" placeholder="0"></div>
      <div class="field"><label data-i18n="exit">Prix sortie</label><input id="f_exit" type="number" step="any" placeholder="0"></div>
      <div class="field"><label data-i18n="qty">Quantité</label><input id="f_qty" type="number" step="any" placeholder="1"></div>
    </div>
    <button type="button" class="btn-ghost btn-sm" id="advToggle" style="width:100%;margin-bottom:12px" data-i18n="advMore">+ de détails</button>
    <div id="advFields" style="display:none">
    <div class="grid3">
      <div class="field"><label data-i18n="stop">Stop (opt.)</label><input id="f_stop" type="number" step="any" placeholder="0"></div>
      <div class="field"><label data-i18n="target">Objectif (opt.)</label><input id="f_target" type="number" step="any" placeholder="0"></div>
      <div class="field"><label data-i18n="fees">Frais (opt.)</label><input id="f_fees" type="number" step="any" placeholder="0"></div>
    </div>
    <div class="grid2">
      <div class="field"><label data-i18n="dateClose">Date sortie (opt.)</label><input id="f_dateClose" type="date"></div>
      <div class="field"><label data-i18n="strat">Stratégie</label><input id="f_strat" placeholder="Breakout, Scalp…"></div>
    </div>
    <div class="field"><label data-i18n="tags">Tags (séparés par virgule)</label><input id="f_tags" placeholder="momentum, news"><div class="chips" id="tagSugg" style="margin-top:6px"></div></div>
    <div class="field">
      <label data-i18n="discipline">Discipline / émotion</label>
      <div class="emoji-row" id="emojiRow">
        <button type="button" data-e="1">😡</button><button type="button" data-e="2">😕</button>
        <button type="button" data-e="3">😐</button><button type="button" data-e="4">🙂</button>
        <button type="button" data-e="5">😎</button>
      </div>
    </div>
    <div class="field">
      <label data-i18n="mistakes">Erreurs (clique pour cocher)</label>
      <div class="chips" id="mistakeChips"></div>
    </div>
    <div class="field" id="rulesField">
      <label data-i18n="rulesFollowed">Règles respectées</label>
      <div class="chips" id="ruleChips"></div>
    </div>
    <div class="grid2">
      <div class="field"><label data-i18n="plan">Plan / thèse avant</label><textarea id="f_plan" rows="2" placeholder="Pourquoi ce trade ?"></textarea></div>
      <div class="field"><label data-i18n="lesson">Leçon après</label><textarea id="f_lesson" rows="2" placeholder="Qu'as-tu appris ?"></textarea></div>
    </div>
    <div class="field"><label data-i18n="notes">Notes</label><textarea id="f_notes" rows="2"></textarea></div>
    <div class="field">
      <label data-i18n="screenshot">Capture du graphe (opt.)</label>
      <input id="f_shot" type="file" accept="image/*">
      <img id="shotPrev" class="shot-prev">
    </div>
    </div>
    <div class="pnl-preview" id="pnlPreview"></div>
    <div class="modal-actions">

function pnlOf(tr){ var d = tr.dir==="long" ? (tr.exit-tr.entry) : (tr.entry-tr.exit); return d*tr.qty - (tr.fees||0); }

function computeStats(trades){
  var s={count:trades.length,net:0,wins:0,losses:0,gp:0,gl:0,best:0,worst:0,rs:[],holds:[]};
  trades.forEach(function(tr){
    var p=pnlOf(tr); s.net+=p;
    if(p>0){s.wins++;s.gp+=p;} else if(p<0){s.losses++;s.gl+=Math.abs(p);}
    if(p>s.best)s.best=p; if(p<s.worst)s.worst=p;
    var r=rMultiple(tr); if(r!=null)s.rs.push(r);
    var h=holdDays(tr); if(h!=null)s.holds.push(h);
  });
  s.winRate = s.count? s.wins/s.count*100 : 0;
  s.pf = s.gl>0 ? s.gp/s.gl : (s.gp>0?Infinity:0);
  s.avgWin = s.wins? s.gp/s.wins : 0;
  s.avgLoss = s.losses? s.gl/s.losses : 0;
  s.expectancy = s.count? s.net/s.count : 0;
  s.avgR = s.rs.length? s.rs.reduce(function(a,b){return a+b;},0)/s.rs.length : null;
  s.avgHold = s.holds.length? s.holds.reduce(function(a,b){return a+b;},0)/s.holds.length : null;
  // streaks (chronologique)
  var ord=trades.slice().sort(function(a,b){return tradeDate(a).localeCompare(tradeDate(b))||a.id-b.id;});
  var ws=0,ls=0,mw=0,ml=0;
  ord.forEach(function(tr){var p=pnlOf(tr); if(p>0){ws++;ls=0;if(ws>mw)mw=ws;} else if(p<0){ls++;ws=0;if(ls>ml)ml=ls;}});
  s.maxWin=mw; s.maxLoss=ml;

}

    for(var i=0;i<norm.length;i++){ if(aliases.indexOf(norm[i].n)>=0){map[field]=norm[i].raw;return;} }
    // contains (distinctif)
    for(var j=0;j<norm.length;j++){ for(var k=0;k<aliases.length;k++){ var a=aliases[k];
      if(a.length>=4 && (norm[j].n.indexOf(a)>=0)){ map[field]=norm[j].raw; return; } } }
  });
  return map;
}
function csvRowToTrade(row,map){
  var entry=csvParseNum(row[map.entry]), exit=csvParseNum(row[map.exit]), qty=csvParseNum(row[map.qty]);
  var symbol=(row[map.symbol]||"").trim();
  if(!symbol||entry==null||exit==null||qty==null||qty===0) return null;
  var dOpen=csvParseDateTime(row[map.dateOpen]); var dClose=csvParseDateTime(row[map.dateClose]);
  var tagsRaw=(row[map.tags]||""); var tags=tagsRaw?tagsRaw.split(/[;|,]/).map(function(s){return s.trim();}).filter(Boolean):[];
  return { symbol:symbol, dir:csvParseDir(row[map.dir]), entry:entry, exit:exit, qty:Math.abs(qty),
    fees:csvParseNum(row[map.fees])||0, stop:csvParseNum(row[map.stop]), target:csvParseNum(row[map.target]),
    dateOpen:dOpen.date||(dClose.date||null), timeOpen:dOpen.time||null, dateClose:dClose.date||null,
    strat:(row[map.strat]||"").trim(), tags:tags, emotion:0, mistakes:[], plan:"", lesson:"",
    notes:(row[map.notes]||"").trim(), screenshot:null };
}
function csvParse(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim()!=="";});
  if(!lines.length) return {headers:[],rows:[]};
  var delim=(lines[0].split(";").length>lines[0].split(",").length)?";":",";
  function splitLine(line){var out=[],cur="",q=false;
    for(var i=0;i<line.length;i++){var c=line[i];
      if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c==='"')q=true; else if(c===delim){out.push(cur);cur="";} else cur+=c; } }
    out.push(cur); return out.map(function(s){return s.trim();}); }
  var headers=splitLine(lines[0]); var rows=[];
  for(var i=1;i<lines.length;i++){ var cells=splitLine(lines[i]); var o={};
    headers.forEach(function(h,j){o[h]=cells[j]!=null?cells[j]:"";}); rows.push(o); }
  return {headers:headers,rows:rows};
}
function csvImportTrades(text){
  var parsed=csvParse(text); if(!parsed.headers.length) return {error:"empty"};
  var map=csvHeaderMap(parsed.headers);
  var missing=["symbol","entry","exit","qty"].filter(function(f){return !map[f];});
  if(missing.length) return {error:"missing",missing:missing,headers:parsed.headers};
  var trades=[],skipped=0;
  parsed.rows.forEach(function(r){ var tr=csvRowToTrade(r,map); if(tr)trades.push(tr); else skipped++; });
  return {trades:trades,skipped:skipped,map:map};
}

function inPeriod(ds){
  if(period==="all") return true; if(!ds) return false;
  var d=new Date(ds), now=new Date();
  if(period==="month") return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  if(period==="year") return d.getFullYear()===now.getFullYear();
  var days=period==="30"?30:90; var cutoff=new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-days);
  return d>=cutoff;
}

function filteredTrades(){
  var list = curTrades().slice();
  if(filters.q){ var q=filters.q.toLowerCase(); list=list.filter(function(tr){ return (tr.symbol||"").toLowerCase().indexOf(q)>=0 || (tr.strat||"").toLowerCase().indexOf(q)>=0 || (tr.tags||[]).join(" ").toLowerCase().indexOf(q)>=0 || (tr.notes||"").toLowerCase().indexOf(q)>=0; }); }
  if(filters.strat) list=list.filter(function(tr){return tr.strat===filters.strat;});
  if(filters.tag) list=list.filter(function(tr){return (tr.tags||[]).indexOf(filters.tag)>=0;});
  if(filters.symbol) list=list.filter(function(tr){return tr.symbol===filters.symbol;});
  if(filters.dir) list=list.filter(function(tr){return tr.dir===filters.dir;});
  if(filters.result==="won") list=list.filter(function(tr){return pnlOf(tr)>0;});
  if(filters.result==="lost") list=list.filter(function(tr){return pnlOf(tr)<0;});
  list.sort(function(a,b){
    var av,bv;
    switch(sortKey){
      case "symbol": av=a.symbol||"";bv=b.symbol||"";break;
      case "pnl": av=pnlOf(a);bv=pnlOf(b);break;
      case "r": av=rMultiple(a)||-999;bv=rMultiple(b)||-999;break;
      case "qty": av=a.qty;bv=b.qty;break;
      default: av=tradeDate(a);bv=tradeDate(b);
    }
    if(av<bv)return -1*sortDir; if(av>bv)return 1*sortDir; return (a.id-b.id)*sortDir;
  });
  return list;
}

function drawEquity(canvas,trades){
  if(!canvas)return;
  var ratio=window.devicePixelRatio||1, W=canvas.clientWidth, H=200;
  canvas.width=W*ratio; canvas.height=H*ratio; var ctx=canvas.getContext("2d"); ctx.scale(ratio,ratio); ctx.clearRect(0,0,W,H);
  var css=getComputedStyle(document.documentElement);
  var pts=equitySeries(trades);
  if(pts.length<2){ ctx.fillStyle=css.getPropertyValue("--muted"); ctx.font="13px IBM Plex Mono,monospace"; ctx.textAlign="center"; ctx.fillText(t("noData"),W/2,H/2); return; }
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts); if(mn===mx){mn-=1;mx+=1;}
  var pl=8,pr=8,pt=14,pb=14,pw=W-pl-pr,ph=H-pt-pb;
  function x(i){return pl+(i/(pts.length-1))*pw;} function y(v){return pt+ph-((v-mn)/(mx-mn))*ph;}
  if(mn<0&&mx>0){ctx.strokeStyle=css.getPropertyValue("--line");ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pl,y(0));ctx.lineTo(W-pr,y(0));ctx.stroke();ctx.setLineDash([]);}
  var end=pts[pts.length-1]>=0;
  var grad=ctx.createLinearGradient(0,pt,0,H);
  grad.addColorStop(0,end?"rgba(38,208,124,.28)":"rgba(255,93,93,.25)"); grad.addColorStop(1,"rgba(38,208,124,0)");
  ctx.beginPath();ctx.moveTo(x(0),y(pts[0]));pts.forEach(function(v,i){ctx.lineTo(x(i),y(v));});
  ctx.lineTo(x(pts.length-1),H-pb);ctx.lineTo(x(0),H-pb);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(x(0),y(pts[0]));pts.forEach(function(v,i){ctx.lineTo(x(i),y(v));});
  ctx.strokeStyle=end?"#26d07c":"#ff5d5d";ctx.lineWidth=2.4;ctx.lineJoin="round";ctx.stroke();
  ctx.beginPath();ctx.arc(x(pts.length-1),y(pts[pts.length-1]),4,0,Math.PI*2);ctx.fillStyle=end?"#26d07c":"#ff5d5d";ctx.fill();
}

  c.width=W*ratio; c.height=H*ratio; var ctx=c.getContext("2d"); ctx.setTransform(ratio,0,0,ratio,0,0); ctx.clearRect(0,0,W,H);

function tickLive(){

  var jobs=pos.map(function(p){ var pair=symbolToPair(p.symbol);
    return fetch("https://api.binance.com/api/v3/ticker/price?symbol="+pair).then(function(r){return r.ok?r.json():null;}).then(function(d){ if(d&&d.price)p.mark=parseFloat(d.price); }).catch(function(){});
  });
  Promise.all(jobs).then(function(){
    var tot=0; pos.forEach(function(p){var u=posPnl(p); if(u!=null)tot+=u;});
    liveSeries.push(tot); if(liveSeries.length>80)liveSeries.shift();

  });

function drawHistogram(canvas,trades){
  if(!canvas)return; var h=histogram(trades,9); var ratio=window.devicePixelRatio||1,W=canvas.clientWidth,H=160;
  canvas.width=W*ratio;canvas.height=H*ratio;var ctx=canvas.getContext("2d");ctx.scale(ratio,ratio);ctx.clearRect(0,0,W,H);
  if(!h)return; var n=h.counts.length,gap=6,bw=(W-gap*(n-1))/n,mx=Math.max.apply(null,h.counts)||1;
  h.counts.forEach(function(c,i){var bh=(c/mx)*(H-26);var x=i*(bw+gap),yv=H-20-bh;var binMid=h.min+h.width*(i+0.5);
    ctx.fillStyle=binMid>=0?"#26d07c":"#ff5d5d";ctx.fillRect(x,yv,bw,bh);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--muted");ctx.font="9px IBM Plex Mono,monospace";ctx.textAlign="center";
    if(c>0)ctx.fillText(c,x+bw/2,yv-3);});
}
function drawMonthly(canvas,trades){
  if(!canvas)return; var m={}; trades.forEach(function(tr){var d=tradeDate(tr);if(!d)return;var k=d.slice(0,7);m[k]=(m[k]||0)+pnlOf(tr);});
  var keys=Object.keys(m).sort(); var ratio=window.devicePixelRatio||1,W=canvas.clientWidth,H=160;
  canvas.width=W*ratio;canvas.height=H*ratio;var ctx=canvas.getContext("2d");ctx.scale(ratio,ratio);ctx.clearRect(0,0,W,H);
  if(!keys.length)return; var vals=keys.map(function(k){return m[k];}),mx=Math.max.apply(null,vals.map(Math.abs))||1;
  var n=keys.length,gap=8,bw=Math.min(46,(W-gap*(n-1))/n),mid=H/2-6;
  keys.forEach(function(k,i){var v=m[k],bh=Math.abs(v)/mx*(H/2-18),x=i*(bw+gap);
    ctx.fillStyle=v>=0?"#26d07c":"#ff5d5d"; if(v>=0)ctx.fillRect(x,mid-bh,bw,bh); else ctx.fillRect(x,mid,bw,bh);
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--muted");ctx.font="9px IBM Plex Mono,monospace";ctx.textAlign="center";
    ctx.fillText(k.slice(5),x+bw/2,H-4);});
}
function drawDrawdown(canvas,trades){
  if(!canvas)return; var pts=equitySeries(trades);
  var ratio=window.devicePixelRatio||1,W=canvas.clientWidth,H=160;
  canvas.width=W*ratio;canvas.height=H*ratio;var ctx=canvas.getContext("2d");ctx.scale(ratio,ratio);ctx.clearRect(0,0,W,H);
  var css=getComputedStyle(document.documentElement);
  if(pts.length<2){ctx.fillStyle=css.getPropertyValue("--muted");ctx.font="13px IBM Plex Mono,monospace";ctx.textAlign="center";ctx.fillText(t("noData"),W/2,H/2);return;}
  var peak=pts[0]; var dd=pts.map(function(v){if(v>peak)peak=v;return peak-v;});
  var mx=Math.max.apply(null,dd)||1;
  var pl=8,pr=8,pt=12,pb=12,pw=W-pl-pr,ph=H-pt-pb;
  function x(i){return pl+(i/(dd.length-1))*pw;} function y(v){return pt+(v/mx)*ph;}
  var grad=ctx.createLinearGradient(0,pt,0,H); grad.addColorStop(0,"rgba(255,93,93,.04)"); grad.addColorStop(1,"rgba(255,93,93,.32)");
  ctx.beginPath();ctx.moveTo(x(0),y(0));dd.forEach(function(v,i){ctx.lineTo(x(i),y(v));});ctx.lineTo(x(dd.length-1),y(0));ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();dd.forEach(function(v,i){if(i===0)ctx.moveTo(x(i),y(v));else ctx.lineTo(x(i),y(v));});
  ctx.strokeStyle="#ff5d5d";ctx.lineWidth=2;ctx.lineJoin="round";ctx.stroke();
}

function drawMood(canvas){
  if(!canvas)return; var cks=state.checkins.slice().filter(function(c){return c.mood;}).sort(function(a,b){return a.date.localeCompare(b.date);}).slice(-14);
  var ratio=window.devicePixelRatio||1,W=canvas.clientWidth,H=130;
  canvas.width=W*ratio;canvas.height=H*ratio;var ctx=canvas.getContext("2d");ctx.scale(ratio,ratio);ctx.clearRect(0,0,W,H);
  var css=getComputedStyle(document.documentElement);
  if(cks.length<2){ctx.fillStyle=css.getPropertyValue("--muted");ctx.font="13px IBM Plex Mono,monospace";ctx.textAlign="center";ctx.fillText(t("noData"),W/2,H/2);return;}
  var pl=10,pr=10,pt=12,pb=12,pw=W-pl-pr,ph=H-pt-pb;
  function x(i){return pl+(i/(cks.length-1))*pw;} function y(v){return pt+ph-((v-1)/4)*ph;}
  ctx.strokeStyle=css.getPropertyValue("--line");ctx.lineWidth=1;[1,3,5].forEach(function(g){ctx.beginPath();ctx.moveTo(pl,y(g));ctx.lineTo(W-pr,y(g));ctx.stroke();});
  ctx.beginPath();cks.forEach(function(c,i){if(i===0)ctx.moveTo(x(i),y(c.mood));else ctx.lineTo(x(i),y(c.mood));});
  ctx.strokeStyle="#f5b544";ctx.lineWidth=2.4;ctx.lineJoin="round";ctx.stroke();

}

  document.getElementById("a_start").value= edit? (a.startBalance||"") : "";
  open("acctOverlay");}
function saveAcct(){var name=val("a_name").trim()||"Compte";
  if(acctEditing){var a=curAccount();a.name=name;a.currency=val("a_curr");a.startBalance=parseFloat(val("a_start"))||0;}
  else{var id=Date.now();state.accounts.push({id:id,name:name,currency:val("a_curr"),startBalance:parseFloat(val("a_start"))||0,trades:[],positions:[]});state.activeId=id;}
  save();close("acctOverlay");refreshAcctSel();renderActive();renderAccount();}
function deleteAccount(){if(state.accounts.length<=1)return;confirmModal(t("confirmDelAcct"),function(){
  state.accounts=state.accounts.filter(function(a){return a.id!==state.activeId;});state.activeId=state.accounts[0].id;save();refreshAcctSel();renderActive();renderAccount();});}

/* ============================= Calculator ============================= */
function openCalc(){["c_capital","c_risk","c_entry","c_stop"].forEach(function(i){document.getElementById(i).value="";});document.getElementById("calcResult").innerHTML='<div class="hint">'+t("notAdvice")+'</div>';open("calcOverlay");}
function calcUpdate(){var cap=numv("c_capital"),rp=numv("c_risk"),en=numv("c_entry"),st=numv("c_stop");var box=document.getElementById("calcResult");
  if(cap==null||rp==null||en==null||st==null||Math.abs(en-st)===0){box.innerHTML='<div class="hint">'+t("notAdvice")+'</div>';return;}
  var riskAmt=cap*rp/100,perUnit=Math.abs(en-st),size=riskAmt/perUnit;
  box.innerHTML='<div class="segrow"><div class="name">'+t("riskAmt")+'</div><div class="bar" style="background:none"></div><div class="num">'+fmtMoney(riskAmt)+'</div></div>'+
    '<div class="segrow"><div class="name">'+t("size")+'</div><div class="bar" style="background:none"></div><div class="num pos">'+size.toLocaleString(lang==="fr"?"fr-FR":"en-US",{maximumFractionDigits:4})+' '+t("shares")+'</div></div>';}

/* ============================= Backup / CSV ============================= */
function download(name,content,type){var blob=new Blob([content],{type:type});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
function exportJson(){download("tradeledger-backup.json",JSON.stringify(state,null,2),"application/json");}
function exportCsv(){var tr=curTrades();if(!tr.length){notify(t("noData"));return;}
  var head=["dateOpen","dateClose","symbol","dir","entry","exit","qty","fees","stop","target","strat","tags","emotion","pnl","notes"];
  var lines=[head.join(",")];
  tr.forEach(function(x){var row=[x.dateOpen||"",x.dateClose||"",x.symbol||"",x.dir,x.entry,x.exit,x.qty,x.fees||0,x.stop!=null?x.stop:"",x.target!=null?x.target:"",x.strat||"",'"'+(x.tags||[]).join(";")+'"',x.emotion||"",pnlOf(x).toFixed(2),'"'+(x.notes||"").replace(/"/g,'""')+'"'];lines.push(row.join(","));});
  download("tradeledger.csv",lines.join("\n"),"text/csv");}
var importMode="json";
function openImport(mode){
  importMode=mode;
  document.getElementById("importTitle").textContent = mode==="json"? t("importJson") : t("importCsv");
  var f=document.getElementById("importPickFile"); f.value=""; f.setAttribute("accept", mode==="json"?".json,application/json":".csv,text/csv");
  var pa=document.getElementById("importPaste"); pa.value=""; pa.setAttribute("placeholder", mode==="json"?'{"accounts":[ ... ]}':"date,symbol,dir,entry,exit,qty, ...");
  open("importOverlay");
}
function processImport(text){
  text=(text||"").trim();
  if(!text){ notify(t("importEmpty")); return; }
  if(importMode==="json"){
    try{ var data=JSON.parse(text);
      if(data && data.accounts){ state=data; if(!state.activeId)state.activeId=state.accounts[0].id; if(!state.cashflows)state.cashflows=[]; if(!state.checkins)state.checkins=[]; if(!state.coachChecks)state.coachChecks=[]; if(!state.deepResults)state.deepResults=[]; if(!state.settings)state.settings={theme:"dark"}; if(!state.settings.rules)state.settings.rules=[]; state.accounts.forEach(function(a){if(!a.positions)a.positions=[];}); save(); refreshAcctSel(); applyTheme(); close("importOverlay"); renderActive(); renderAccount(); toast(t("saved"),null,null); }
      else notify(lang==="fr"?"Format JSON invalide (aucun compte trouvé).":"Invalid JSON (no accounts found).");
    }catch(e){ notify(lang==="fr"?"JSON invalide.":"Invalid JSON."); }
  } else {
    var res=csvImportTrades(text);
    if(res.error==="missing"){ notify(t("csvMissing")+res.missing.join(", ")+"\n\n("+(lang==="fr"?"colonnes lues":"file columns")+" : "+res.headers.join(", ")+")"); return; }
    if(res.error||!res.trades||!res.trades.length){ notify(lang==="fr"?"Aucun trade lisible dans ce CSV.":"No readable trades in this CSV."); return; }
    var a=curAccount();
    confirmModal(t("csvConfirm").replace("{n}",res.trades.length).replace("{a}",a.name), function(){
      var base=Date.now(); res.trades.forEach(function(tr,i){ tr.id=base+i; a.trades.push(tr); });
      save(); close("importOverlay"); renderActive(); renderAccount();
      toast(res.trades.length+t("csvImported")+(res.skipped?(" · "+res.skipped+t("csvSkippedTxt")):""),null,null);
    });
  }
}
function confirmModal(msg,onOk){ var m=document.getElementById("confirmMsg"); m.textContent=msg; var ca=document.getElementById("confirmCancel"), ok=document.getElementById("confirmOk"); ca.style.display=""; ca.textContent=t("cancel"); ok.textContent="OK"; open("confirmOverlay"); ok.onclick=function(){close("confirmOverlay"); if(onOk)onOk();}; ca.onclick=function(){close("confirmOverlay");}; }
function notify(msg){ var m=document.getElementById("confirmMsg"); m.textContent=msg; document.getElementById("confirmCancel").style.display="none"; var ok=document.getElementById("confirmOk"); ok.textContent="OK"; open("confirmOverlay"); ok.onclick=function(){close("confirmOverlay");}; }
document.getElementById("importPickFile").addEventListener("change",function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(ev){document.getElementById("importPaste").value=ev.target.result;};r.readAsText(file);});
document.getElementById("importCancel").addEventListener("click",function(){close("importOverlay");});
document.getElementById("importDo").addEventListener("click",function(){processImport(document.getElementById("importPaste").value);});


/* ============================= Helpers / wiring ============================= */
function bind(id,evt,fn){var e=document.getElementById(id);if(e)e.addEventListener(evt,fn);}
function open(id){document.getElementById(id).classList.add("open");}
function close(id){document.getElementById(id).classList.remove("open");}
var toastTimer=null;
function toast(msg,actionLabel,fn){var el=document.getElementById("toast");document.getElementById("toastMsg").textContent=msg;var b=document.getElementById("toastAction");
  if(actionLabel){b.textContent=actionLabel;b.style.display="";b.onclick=function(){fn();el.classList.remove("show");};}else{b.style.display="none";}
  el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove("show");},4000);}

function freshStart(){ var s={theme:state.settings.theme,lang:state.settings.lang,goal:state.settings.goal,rules:state.settings.rules||[],dailyLossLimit:state.settings.dailyLossLimit,profile:state.settings.profile,live:state.settings.live,wallet:state.settings.wallet}; var sym=curSymbol(); var nid=Date.now(); state={accounts:[{id:nid,name:(lang==="fr"?"Mon compte":"My account"),currency:sym,startBalance:0,trades:[],positions:[]}],activeId:nid,cashflows:[],checkins:[],coachChecks:[],deepResults:[],settings:s}; save(); location.reload(); }
function refreshAcctSel(){var sel=document.getElementById("acctSel");sel.innerHTML=state.accounts.map(function(a){return '<option value="'+a.id+'"'+(a.id===state.activeId?" selected":"")+'>'+esc(a.name)+'</option>';}).join("");}

var activeTab="dashboard";
function renderActive(){
  if(activeTab==="dashboard")renderDashboard();
  else if(activeTab==="trades")renderTrades();
  else if(activeTab==="calendar")renderCalendar();
  else if(activeTab==="analyse")renderAnalyse();
  else if(activeTab==="mental")renderMental();
  else if(activeTab==="coach")renderCoachTab();
  else if(activeTab==="account")renderAccount();
}
function switchTab(name){activeTab=name;
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-tab")===name);});
  document.querySelectorAll(".tab").forEach(function(s){s.style.display="none";});
  document.getElementById("tab-"+name).style.display="";
  window.scrollTo(0,0);
  renderActive();
  if(name==="trades" && state.settings.live) startLive(); else stopLive();}

/* ============================= Init ============================= */
function applyTheme(){document.documentElement.setAttribute("data-theme",state.settings.theme);document.getElementById("themeBtn").textContent=state.settings.theme==="dark"?"☾":"☀";}
function init(){
  if(!load()){ seedDemo(); save(); }
  if(!state.cashflows)state.cashflows=[];
  if(!state.checkins)state.checkins=[];
  if(!state.coachChecks)state.coachChecks=[];
  if(!state.deepResults)state.deepResults=[];
  state.accounts.forEach(function(a){if(!a.positions)a.positions=[];});
  if(!state.settings)state.settings={theme:"dark"};
  if(!state.settings.rules)state.settings.rules=[];
  lang = state.settings.lang || "fr";
  applyTheme(); applyI18n(); buildMistakeChips(); refreshAcctSel();
  switchTab("dashboard");
  // top wiring
  document.getElementById("addBtn").addEventListener("click",function(){open("chooseOverlay");});
  document.getElementById("fab").addEventListener("click",function(){open("chooseOverlay");});
  bind("chooseCancel","click",function(){close("chooseOverlay");});
  bind("chooseClosed","click",function(){close("chooseOverlay");openTrade(null);});
  bind("chooseLive","click",function(){close("chooseOverlay");openPosition(null);});
  document.getElementById("helpBtn").addEventListener("click",openGuide);
  document.getElementById("acctSel").addEventListener("change",function(e){state.activeId=Number(e.target.value);save();renderActive();});
  document.getElementById("themeBtn").addEventListener("click",function(){state.settings.theme=state.settings.theme==="dark"?"light":"dark";document.querySelector('meta[name=theme-color]').setAttribute("content",state.settings.theme==="dark"?"#0a0e14":"#f4f6f9");save();applyTheme();renderActive();});
  document.getElementById("langBtn").addEventListener("click",function(){lang=lang==="fr"?"en":"fr";state.settings.lang=lang;save();applyI18n();buildMistakeChips();renderActive();});
  document.querySelectorAll("#tabs button").forEach(function(b){b.addEventListener("click",function(){switchTab(b.getAttribute("data-tab"));});});
  // modal wiring
  document.querySelectorAll("#dirSeg button").forEach(function(b){b.addEventListener("click",function(){setDir(b.getAttribute("data-dir"));});});
  document.querySelectorAll("#emojiRow button").forEach(function(b){b.addEventListener("click",function(){setEmotion(Number(b.getAttribute("data-e")));});});
  ["f_entry","f_exit","f_qty","f_fees","f_stop","f_target"].forEach(function(i){document.getElementById(i).addEventListener("input",updatePnl);});
  bind("tradeCancel","click",function(){close("tradeOverlay");});

  document.getElementById("tradeOverlay").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"){e.preventDefault();saveTrade();}});
